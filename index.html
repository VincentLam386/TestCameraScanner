<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Stock Inquiry</title>

    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <script type="text/javascript" src="lib/html5-qrcode.min.js"></script>
</head>
<body>
    <nav class="navbar bg-primary navbar-dark shadow-sm">
        <div class="container-fluid">
            <button id="btnScan" class="btn btn-outline-light">
                <i class="bi bi-camera-fill"></i>
            </button>
            <span class="navbar-brand mb-0">
                Stock Inquiry
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 id="itemCode" class="text-center">
                    Scan an Item
                </h1>
            </div>
        </div>

        <div class="card shadow-sm mt-3">
            <div class="card-body">
                <table id="stockTable"
                    class="table table-bordered table-striped mb-0">
                    <thead>
                        <tr>
                            <th width="35%">Size</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="stockBody">
                        <tr>
                            <td colspan="2"
                                class="text-center text-muted">
                                Scan an item to begin
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <!-- Scanner Modal -->

    <div
        class="modal fade"
        id="scannerModal"
        tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Scan QR / Barcode
                    </h5>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>
                </div>
                <div class="modal-body">
                    <div id="reader"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
