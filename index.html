<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>庫存查詢 Stock Enquiry</title>

    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="lib/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" href="lib/bootstrap-icons/font/bootstrap-icons.min.css"/>
    <script type="text/javascript" src="lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="lib/html5-qrcode/js/html5-qrcode.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark custom-navbar shadow-sm">
        <div class="container-fluid position-relative">
            <button id="btnScan" class="btn btn-outline-light">
                <i class="bi bi-camera-fill"></i>
            </button>
            <h4 class="position-absolute start-50 translate-middle-x text-white text-center mb-0">
                庫存查詢<br/>Stock Enquiry
            </h4>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 id="itemCode" class="text-center">
                    掃描貨品<br/>Scan an Item
                </h1>
            </div>
        </div>

        <div class="card shadow-sm mt-3">
            <div class="card-body">
                <table id="stockTable"
                    class="table table-bordered table-striped mb-0">
                    <thead>
                        <tr>
                            <th width="35%">尺碼 Size</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="stockBody">
                        <tr>
                            <td colspan="2"
                                class="text-center text-muted">
                                掃描貨品以查詢<br/>Scan an item to begin
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <!-- Scanner Modal -->

    <div
        class="modal fade"
        id="scannerModal"
        tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        掃描二維碼/條碼<br/>Scan QR/Barcode
                    </h5>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>
                </div>
                <div class="modal-body">
                    <div id="reader"></div>
                    <div
                        id="cameraError"
                        class="alert alert-danger text-center d-none">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
