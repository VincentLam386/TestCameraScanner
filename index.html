<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="lib/html5-qrcode.min.js" type="text/javascript"></script>
</head>
<body>

    <div class="container">
        <button id="cameraBtn">
            📷
        </button>

        <div id="reader"></div>

        <div id="controls" class="hidden">
            <label for="focus-slider">Manual Focus Distance</label>
            <input type="range" id="focus-slider" min="0" max="1" step="0.01" value="0.5">
            <div id="focus-value">--</div>
        </div>

        <div id="result"></div>
    </div>

</body>
</html>
